# Netlify reads this on every deploy, so the build settings live in the repo
# instead of the Netlify dashboard.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# React draws every page, so any address (like /escalada) serves index.html
# and the router picks the page. Real files, like the images, still win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
